<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Masuk — Toko Budi Sembako</title><link rel="stylesheet" href="../css/style.css"></head><body class="login-body"><form id="loginForm" class="login-card"><div class="brand-logo login-logo"><i class="fa-solid fa-basket-shopping"></i></div><h1>Masuk Toko Budi Sembako</h1><p>Login opsional jika Supabase Auth telah diaktifkan.</p><label class="field">Email<input id="email" type="email" class="control" required></label><label class="field">Password<input id="password" type="password" class="control" required></label><button class="btn-primary" type="submit">Masuk</button><div id="loginMessage" class="hint"></div><a href="index.html">Kembali ke aplikasi demo</a></form><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>
document.querySelector("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const msg=document.querySelector("#loginMessage");try{const c=window.RetailConfig.getClient();if(!c)throw new Error("Konfigurasikan Supabase terlebih dahulu di halaman aplikasi.");const {error}=await c.auth.signInWithPassword({email:document.querySelector("#email").value,password:document.querySelector("#password").value});if(error)throw error;msg.textContent="Login berhasil. Kembali ke aplikasi."; }catch(err){msg.textContent=err.message||"Login gagal";}});
</script></body></html>
